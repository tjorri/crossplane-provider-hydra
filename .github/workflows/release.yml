name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  CONTROLLER_IMAGE: ghcr.io/tjorri/crossplane-provider-hydra-controller
  PACKAGE_IMAGE: ghcr.io/tjorri/crossplane-provider-hydra
  # Also read by the Makefile's xpkg-*-multiarch targets.
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      # --- Tests ---

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Unit tests
        run: go test -short -race ./...

      # --- Generate CRDs ---

      - name: Install tools
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@latest
          go install github.com/crossplane/crossplane-tools/cmd/angryjet@latest

      - name: Generate CRDs and methods
        run: make generate

      # --- Controller image ---

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push controller image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: |
            ${{ env.CONTROLLER_IMAGE }}:${{ env.VERSION }}
            ${{ env.CONTROLLER_IMAGE }}:latest
          # Persist the go-mod-download layer and the build stage cache
          # across releases. Without it, every release repaid the ~40s
          # `go mod download` step even when go.sum hadn't changed.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Crossplane package (xpkg) ---

      - name: Install Crossplane CLI and crane
        run: |
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh" | sh
          sudo mv crossplane /usr/local/bin/
          go install github.com/google/go-containerregistry/cmd/crane@latest

      # One xpkg per platform, each embedding that platform's controller as
      # its runtime. The per-platform builds run on the same buildx builder
      # as the controller image step above, so they hit its layer cache.
      - name: Build per-platform xpkgs
        run: make xpkg-build-multiarch

      # `xpkg push` with several files pushes each by digest and tags an OCI
      # image index referencing them, so `spec.package: ...:<tag>` resolves
      # to the node's platform. `crane tag` points `latest` at the same index.
      # PACKAGE_REF is passed explicitly so the push, the verify and the tag
      # all use this workflow's PACKAGE_IMAGE rather than the Makefile's.
      - name: Push multi-arch xpkg to GHCR
        env:
          PACKAGE_REF: ${{ env.PACKAGE_IMAGE }}:${{ env.VERSION }}
        run: |
          make xpkg-push-multiarch xpkg-verify-multiarch
          crane tag "$PACKAGE_REF" latest

      # --- Attach xpkgs to GitHub Release ---

      - name: Upload xpkgs to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          files: _output/*.xpkg
