name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -short -race -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -v -count=1 -timeout=10m ./e2e/...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build -o /dev/null ./cmd/provider/

  # Runs the release workflow's packaging steps against a throwaway local
  # registry, so a broken multi-arch xpkg build fails here instead of at
  # release time.
  xpkg:
    name: Multi-arch Package
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      PLATFORMS: linux/amd64,linux/arm64
      VERSION: v0.0.0-ci
      PACKAGE_REF: localhost:5000/crossplane-provider-hydra:v0.0.0-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install tools
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@latest
          go install github.com/crossplane/crossplane-tools/cmd/angryjet@latest
          go install github.com/google/go-containerregistry/cmd/crane@latest
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh" | sh
          sudo mv crossplane /usr/local/bin/
      - uses: docker/setup-buildx-action@v4
      - name: Build per-platform xpkgs
        run: make xpkg-build-multiarch
      - name: Push to local registry and verify platforms
        run: make xpkg-push-multiarch xpkg-verify-multiarch

  e2e-kind:
    name: Kind E2E Tests (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install tools
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@latest
          go install github.com/crossplane/crossplane-tools/cmd/angryjet@latest
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh" | sh
          sudo mv crossplane /usr/local/bin/
      - name: Install Kind
        run: |
          go install sigs.k8s.io/kind@latest
      - name: Install Helm
        uses: azure/setup-helm@v5
      - name: Run Kind e2e tests
        run: make test-e2e-kind
      - name: Dump debug info on failure
        if: failure()
        run: |
          echo "--- Provider logs ---"
          kubectl -n provider-hydra logs -l app=provider-hydra --tail=100 2>/dev/null || true
          echo "--- Hydra logs ---"
          kubectl -n hydra logs -l app=hydra --tail=100 2>/dev/null || true
          echo "--- OAuth2Client status ---"
          kubectl get oauth2client -A -o yaml 2>/dev/null || true
      - name: Teardown
        if: always()
        run: make test-e2e-kind-teardown
